<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rabbit Ninja</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #1A1A2E;
    --text: #f0f0f5;
    --muted: #A0A0B0;
    --accent: #E94560;
    --border: rgba(255, 255, 255, 0.08);
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  header.hero {
    width: 100%;
    aspect-ratio: 3.4 / 1;
    max-height: 380px;
    overflow: hidden;
    border-bottom: 1px solid var(--border);
  }
  .hero-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
  }
  section.content {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 20px;
  }
  p { color: var(--muted); font-size: 1.1rem; margin: 0; }
</style>
</head>
<body>
<header class="hero">
  <h1 class="sr-only">Rabbit Ninja</h1>
  <img class="hero-img" src="hero-bg.jpg" alt="Rabbit Ninja logo — a cartoon ninja rabbit crouched with a katana, on a dark geometric background">
</header>
<section class="content">
  <p>Site coming soon.</p>
</section>
</body>
</html>
