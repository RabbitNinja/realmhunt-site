<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rabbit Ninja</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #1A1A2E;
    --text: #f0f0f5;
    --muted: #A0A0B0;
    --accent: #E94560;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #ffffff;
      --text: #1a1a2e;
      --muted: #5a5a6e;
      --accent: #E94560;
    }
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100vh;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    box-sizing: border-box;
  }
  h1 { font-size: 2.2rem; margin-bottom: 8px; }
  p { color: var(--muted); font-size: 1.1rem; }
  .accent { color: var(--accent); }
</style>
</head>
<body>
<div>
  <h1>Rabbit<span class="accent">Ninja</span></h1>
  <p>Site coming soon.</p>
</div>
</body>
</html>
